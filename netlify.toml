# Configuration Netlify pour VAULT

[build]
  # Commande pour créer le build de production
  command = "npm run build"
  
  # Dossier contenant les fichiers à déployer
  publish = "dist"
  
  # Définir les variables d'environnement
  [build.environment]
    NODE_VERSION = "18"

# Redirections pour Single Page Application (SPA)
# Nécessaire pour que les routes React fonctionnent correctement
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers pour les assets statiques (cache long)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Configuration pour les fonctions serverless (si besoin futur)
[functions]
  directory = "netlify/functions"
